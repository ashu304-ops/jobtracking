name: Daily Embedded Job Scraper

on:
  schedule:
    - cron: '0 3 * * *' # Runs daily at 8:30 AM IST (03:00 UTC)
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (TeX Live & pdflatex)
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-fonts-recommended

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas python-jobspy requests

      - name: Run Job Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/main.py

      - name: Commit and Push Updated Applications Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add applications/jobs_database.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update daily job database [skip ci]" && git push)
